aid: theom
name: Theom
description: >-
  Theom is a cloud Data & AI Operations Center that governs and secures enterprise data estates,
  providing automated data security, compliance, and safe generative-AI data activation across
  multi-cloud environments. Founded in December 2020 by former Cisco, Google, and Yahoo security
  practitioners (creators of Tetration Analytics), Theom detects active data breaches, maps real-time
  data lineage, analyzes identity-aware data usage and insider threats, and enforces data-usage policy
  agentlessly. Its product spans Theom Core (data security and lineage), Theom AI (GenAI leak
  prevention), and Theom Trust (real-time data contracts). Theom is backed by Wing Venture Capital,
  Ridge Ventures, Snowflake Ventures, Databricks Ventures, SentinelOne Ventures, and M12, and was
  named a Leader in the 2026 Forrester Wave for Sensitive Data Discovery and Classification. Theom is
  delivered as an enterprise platform; it does not publish a public developer API, SDKs, or API docs.
